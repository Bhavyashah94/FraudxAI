<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background:#FFFFFF; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Crisp Subtle Drop Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
    
    <!-- Sharp Black Arrow Marker -->
    <marker id="arrow-bw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0F172A"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <rect x="25" y="25" width="1550" height="850" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/>

  <!-- Top Slide Title -->
  <text x="70" y="80" font-family="'DM Serif Text', Georgia, serif, -apple-system" font-size="28" font-weight="700" fill="#0F172A">System Architecture: End-to-End Simulation &amp; XAI Auditing</text>
  <text x="70" y="110" font-size="14.5" fill="#475569">From generative multi-agent transactions to ground-truth explainability benchmarks</text>

  <!-- 4 Monochromatic Pipeline Cards -->

  <!-- STAGE 1: Multi-Agent Simulation -->
  <g transform="translate(65, 145)" filter="url(#shadow)">
    <rect width="325" height="665" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/>
    <!-- Card Header -->
    <rect width="325" height="65" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect y="50" width="325" height="15" fill="#F8FAFC"/>
    <line x1="0" y1="65" x2="325" y2="65" stroke="#0F172A" stroke-width="1.5"/>
    <circle cx="45" cy="32" r="16" fill="#0F172A"/>
    <text x="45" y="37" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">01</text>
    <text x="75" y="38" font-size="16.5" font-weight="700" fill="#0F172A">Multi-Agent Simulation</text>
    
    <g transform="translate(20, 85)">
      <!-- Point 1 -->
      <rect x="0" y="0" width="285" height="125" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="20" cy="24" r="4" fill="#0F172A"/>
      <text x="32" y="28" font-size="14.5" font-weight="700" fill="#0F172A">Normal Cardholders</text>
      <text x="32" y="52" font-size="12.5" fill="#334155">
        <tspan x="32" dy="0">• Calibrated US &amp; India spending habits</tspan>
        <tspan x="32" dy="20">• Commutes, meals &amp; online shopping</tspan>
        <tspan x="32" dy="20">• Diurnal 24h spending rhythms</tspan>
      </text>

      <!-- Point 2 -->
      <rect x="0" y="145" width="285" height="125" rx="8" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.2"/>
      <circle cx="20" cy="169" r="4" fill="#0F172A"/>
      <text x="32" y="173" font-size="14.5" font-weight="700" fill="#0F172A">Adaptive Attackers</text>
      <text x="32" y="197" font-size="12.5" fill="#334155">
        <tspan x="32" dy="0">• 10 cybercrime attack playbooks</tspan>
        <tspan x="32" dy="20">• Card testing, stolen wallets &amp; ATO</tspan>
        <tspan x="32" dy="20">• Backs off or decays on decline</tspan>
      </text>

      <!-- Point 3 -->
      <rect x="0" y="290" width="285" height="125" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="20" cy="314" r="4" fill="#0F172A"/>
      <text x="32" y="318" font-size="14.5" font-weight="700" fill="#0F172A">Merchant Environment</text>
      <text x="32" y="342" font-size="12.5" fill="#334155">
        <tspan x="32" dy="0">• 4-digit MCC merchant taxonomy</tspan>
        <tspan x="32" dy="20">• Physical in-store POS vs e-Commerce</tspan>
        <tspan x="32" dy="20">• Dual-currency (USD cents / INR paisa)</tspan>
      </text>

      <!-- Bottom Tag -->
      <rect x="0" y="445" width="285" height="42" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>
      <text x="142" y="471" text-anchor="middle" font-size="12" font-weight="600" fill="#0F172A">Generates 64,000+ events / sec</text>
    </g>
  </g>

  <!-- Flow Arrow 1 -> 2 -->
  <line x1="400" y1="475" x2="435" y2="475" stroke="#0F172A" stroke-width="2" marker-end="url(#arrow-bw)"/>

  <!-- STAGE 2: Real-World Banking Rules -->
  <g transform="translate(445, 145)" filter="url(#shadow)">
    <rect width="325" height="665" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/>
    <rect width="325" height="65" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect y="50" width="325" height="15" fill="#F8FAFC"/>
    <line x1="0" y1="65" x2="325" y2="65" stroke="#0F172A" stroke-width="1.5"/>
    <circle cx="45" cy="32" r="16" fill="#0F172A"/>
    <text x="45" y="37" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">02</text>
    <text x="75" y="38" font-size="16.5" font-weight="700" fill="#0F172A">Banking Rules &amp; Switch</text>

    <g transform="translate(20, 85)">
      <!-- Point 1 -->
      <rect x="0" y="0" width="285" height="125" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="20" cy="24" r="4" fill="#0F172A"/>
      <text x="32" y="28" font-size="14.5" font-weight="700" fill="#0F172A">Payment Switch (&lt;50ms)</text>
      <text x="32" y="52" font-size="12.5" fill="#334155">
        <tspan x="32" dy="0">• ISO 8583 financial message rails</tspan>
        <tspan x="32" dy="20">• Instant approve / decline codes</tspan>
        <tspan x="32" dy="20">• Pre-authorization hold lifecycle</tspan>
      </text>

      <!-- Point 2 -->
      <rect x="0" y="145" width="285" height="125" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="20" cy="169" r="4" fill="#0F172A"/>
      <text x="32" y="173" font-size="14.5" font-weight="700" fill="#0F172A">Regulatory Guardrails</text>
      <text x="32" y="197" font-size="12.5" fill="#334155">
        <tspan x="32" dy="0">• RBI mandatory 2-Factor OTP</tspan>
        <tspan x="32" dy="20">• Rule 114B ₹50,000 cash/PAN limits</tspan>
        <tspan x="32" dy="20">• US Reg B Adverse Action notices</tspan>
      </text>

      <!-- Point 3 -->
      <rect x="0" y="290" width="285" height="125" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="20" cy="314" r="4" fill="#0F172A"/>
      <text x="32" y="318" font-size="14.5" font-weight="700" fill="#0F172A">Physical Invariants</text>
      <text x="32" y="342" font-size="12.5" fill="#334155">
        <tspan x="32" dy="0">• Great-circle travel speed limits</tspan>
        <tspan x="32" dy="20">• Blocks &gt;900 km/h impossible travel</tspan>
        <tspan x="32" dy="20">• Strict double-entry balance check</tspan>
      </text>

      <!-- Bottom Tag -->
      <rect x="0" y="445" width="285" height="42" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>
      <text x="142" y="471" text-anchor="middle" font-size="12" font-weight="600" fill="#0F172A">152 / 152 Automated Tests Passed</text>
    </g>
  </g>

  <!-- Flow Arrow 2 -> 3 -->
  <line x1="780" y1="475" x2="815" y2="475" stroke="#0F172A" stroke-width="2" marker-end="url(#arrow-bw)"/>

  <!-- STAGE 3: Operations & Review Queue -->
  <g transform="translate(825, 145)" filter="url(#shadow)">
    <rect width="325" height="665" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/>
    <rect width="325" height="65" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect y="50" width="325" height="15" fill="#F8FAFC"/>
    <line x1="0" y1="65" x2="325" y2="65" stroke="#0F172A" stroke-width="1.5"/>
    <circle cx="45" cy="32" r="16" fill="#0F172A"/>
    <text x="45" y="37" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">03</text>
    <text x="75" y="38" font-size="16.5" font-weight="700" fill="#0F172A">Operations &amp; Supervision</text>

    <g transform="translate(20, 85)">
      <!-- Point 1 -->
      <rect x="0" y="0" width="285" height="125" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="20" cy="24" r="4" fill="#0F172A"/>
      <text x="32" y="28" font-size="14.5" font-weight="700" fill="#0F172A">Human Investigator Desk</text>
      <text x="32" y="52" font-size="12.5" fill="#334155">
        <tspan x="32" dy="0">• Daily alert review capacity limits</tspan>
        <tspan x="32" dy="20">• Prioritizes high-risk card alerts</tspan>
        <tspan x="32" dy="20">• Rapid verification (24 to 72 hours)</tspan>
      </text>

      <!-- Point 2 -->
      <rect x="0" y="145" width="285" height="125" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="20" cy="169" r="4" fill="#0F172A"/>
      <text x="32" y="173" font-size="14.5" font-weight="700" fill="#0F172A">Dispute &amp; Chargeback Lag</text>
      <text x="32" y="197" font-size="12.5" fill="#334155">
        <tspan x="32" dy="0">• 30 to 90 day customer dispute delay</tspan>
        <tspan x="32" dy="20">• Simulates statement arrival lag</tspan>
        <tspan x="32" dy="20">• Accounts for unreported dark fraud</tspan>
      </text>

      <!-- Point 3 -->
      <rect x="0" y="290" width="285" height="125" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="20" cy="314" r="4" fill="#0F172A"/>
      <text x="32" y="318" font-size="14.5" font-weight="700" fill="#0F172A">Zero-Leakage Partitioning</text>
      <text x="32" y="342" font-size="12.5" fill="#334155">
        <tspan x="32" dy="0">• Real-time inference feed (Day 0)</tspan>
        <tspan x="32" dy="20">• Settlement feed (Day 1-3)</tspan>
        <tspan x="32" dy="20">• Prevents models peeking into future</tspan>
      </text>

      <!-- Bottom Tag -->
      <rect x="0" y="445" width="285" height="42" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>
      <text x="142" y="471" text-anchor="middle" font-size="12" font-weight="600" fill="#0F172A">Authentic Banking Operations</text>
    </g>
  </g>

  <!-- Flow Arrow 3 -> 4 -->
  <line x1="1160" y1="475" x2="1195" y2="475" stroke="#0F172A" stroke-width="2" marker-end="url(#arrow-bw)"/>

  <!-- STAGE 4: Ground-Truth XAI Benchmark -->
  <g transform="translate(1205, 145)" filter="url(#shadow)">
    <rect width="325" height="665" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/>
    <rect width="325" height="65" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect y="50" width="325" height="15" fill="#F8FAFC"/>
    <line x1="0" y1="65" x2="325" y2="65" stroke="#0F172A" stroke-width="1.5"/>
    <circle cx="45" cy="32" r="16" fill="#0F172A"/>
    <text x="45" y="37" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">04</text>
    <text x="75" y="38" font-size="16.5" font-weight="700" fill="#0F172A">Ground-Truth XAI Audits</text>

    <g transform="translate(20, 85)">
      <!-- Point 1 -->
      <rect x="0" y="0" width="285" height="125" rx="8" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.2"/>
      <circle cx="20" cy="24" r="4" fill="#0F172A"/>
      <text x="32" y="28" font-size="14.5" font-weight="700" fill="#0F172A">Known Attack Cause (Δx)</text>
      <text x="32" y="52" font-size="12.5" fill="#334155">
        <tspan x="32" dy="0">• Records exact cardholder baseline</tspan>
        <tspan x="32" dy="20">• Knows exact amount/speed jump</tspan>
        <tspan x="32" dy="20">• True mathematical "answer key"</tspan>
      </text>

      <!-- Point 2 -->
      <rect x="0" y="145" width="285" height="125" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="20" cy="169" r="4" fill="#0F172A"/>
      <text x="32" y="173" font-size="14.5" font-weight="700" fill="#0F172A">Model Benchmarking</text>
      <text x="32" y="197" font-size="12.5" fill="#334155">
        <tspan x="32" dy="0">• Evaluates XGBoost &amp; LightGBM</tspan>
        <tspan x="32" dy="20">• Benchmarks transparent EBM</tspan>
        <tspan x="32" dy="20">• Rolling prequential time testing</tspan>
      </text>

      <!-- Point 3 -->
      <rect x="0" y="290" width="285" height="125" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="20" cy="314" r="4" fill="#0F172A"/>
      <text x="32" y="318" font-size="14.5" font-weight="700" fill="#0F172A">Auditing Explanations</text>
      <text x="32" y="342" font-size="12.5" fill="#334155">
        <tspan x="32" dy="0">• Audits SHAP, LIME, and EBM</tspan>
        <tspan x="32" dy="20">• Quantus mathematical metrics</tspan>
        <tspan x="32" dy="20">• Proves if AI tells truth or lies</tspan>
      </text>

      <!-- Bottom Tag -->
      <rect x="0" y="445" width="285" height="42" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>
      <text x="142" y="471" text-anchor="middle" font-size="12" font-weight="600" fill="#0F172A">Verifiable Trust for Regulators</text>
    </g>
  </g>
</svg>
