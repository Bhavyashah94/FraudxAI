name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,benchmark]

      - name: Run PyTest Test Suite
        run: |
          python -m pytest tests/ -v

      - name: Verify Banking Rail Invariants
        run: |
          python scripts/verify_grounded_invariants.py

      - name: Run Dataset Realness & Separation Audit
        run: |
          python scripts/audit_fraud_realness.py

      - name: Verify Empirical XAI Benchmark Harness
        run: |
          python -m fraudx_synthesizer.cli benchmark -n 500 --json
