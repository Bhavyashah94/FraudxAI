name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# One OS and one interpreter: the pair the README and the SYNOPSIS quote (Python 3.12 on
# Linux), which is also what the suite is run on locally. A matrix multiplies runner time
# without telling us anything the local run does not; widen it deliberately if a port turns
# up a real difference.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,benchmark,gui]"

      - name: Run PyTest Test Suite
        run: |
          python -m pytest tests/ -v

      - name: Verify Banking Rail Invariants
        run: |
          python scripts/verify_grounded_invariants.py

      - name: Run Dataset Realness & Separation Audit
        run: |
          python scripts/audit_fraud_realness.py

      - name: Verify Empirical XAI Benchmark Harness
        run: |
          python -m fraudx_synthesizer.cli benchmark -n 500 --json

      # Guards the command the README tells people to run for a grade. It fails if the
      # pinned protocol drifts (a changed default, a changed spec/18 pin) or if an
      # on-protocol run stops publishing the stability summary that replaces a single
      # seed's violation count. See reports/certification_grade_stability.md.
      - name: Verify Pinned Certification Protocol
        run: |
          python -m fraudx_synthesizer.cli benchmark -n 2000 --unified --seed 42 \
            --output-dir "$RUNNER_TEMP/benchmark"
          python - <<'PY'
          import json
          import os

          with open(os.path.join(os.environ["RUNNER_TEMP"], "benchmark", "benchmark_results.json")) as handle:
              report = json.load(handle)

          mismatches = report["metadata"]["protocol_mismatches"]
          assert not mismatches, f"pinned certification command is OFF-PROTOCOL: {mismatches}"

          stability = report.get("stability")
          assert stability, "on-protocol run published no stability summary"
          assert stability["runs"] == 5, f"expected 5 pinned seeds, got {stability['runs']}"
          assert stability["seeds"] == [42, 0, 1, 2, 3], f"unexpected seeds: {stability['seeds']}"

          print(
              f"on-protocol {report['certification_grade']}: "
              f"main run {len(report['violations'])} violations; "
              f"{min(stability['violation_counts'])}-{max(stability['violation_counts'])} across "
              f"{stability['runs']} seeds; {len(stability['unstable_gates'])} gates flip with the seed"
          )
          PY
