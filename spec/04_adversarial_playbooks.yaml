    tranche_ceiling_usd: 1950.00 # Below $2,000 retail AML limit
    transfer_rails: ["ZELLE", "FEDNOW", "RTP", "SAME_DAY_ACH"]
    corporate_shell_account_ratio: 0.35 # High-limit current accounts
    hop_latency_seconds: [30, 120]
  layer_3_crypto_severance:
