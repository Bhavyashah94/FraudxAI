# spec/04_adversarial_playbooks.yaml
# Canonical Specification for Adversarial Attack Playbooks, Cybercrime Infrastructure & Dynamic Adaptation
# Grounded in: US DOJ Indictments (911 S5, May 2024), Ali et al. (IEEE S&P 2017), Mi et al. (IEEE S&P 2019),
# Vastel et al. (USENIX Security 2018), Visa Account Attack Intelligence (VAAI), Real-World Botnet Case Studies.

schema_version: "1.1.0"
unit_definitions:
  currency: "USD_cents"
  time: "seconds"
  probability: "[0.0, 1.0]"
  ratio: "bps_or_percentage"

darknet_market_economics:
  asset_pricing_cents:
    track_2_no_pin: { min: 1500, max: 4500 }
    track_2_with_pin: { min: 8000, max: 22000 }
    cvv_cnp_record: { min: 800, max: 3000 }
    fullz_classic: { min: 3500, max: 12000 }
    fullz_ultra_premium: { min: 15000, max: 35000 }
  warranty_window_seconds: 7200  # 2-hour darknet replacement warranty
  expiration_decay_model:
    formula: "V(t) = V_0 * [0.65 * exp(-t / 41.11) + 0.35 * exp(-t / 375.1)]"
    fast_half_life_hours: 28.5
    slow_half_life_hours: 260.0

liquidation_channels:
  - id: "LIQ_GIFT_CARDS"
    mccs: [5947, 5310]
    haircut_discount_ratio: 0.25 # 75 cents on dollar
    settlement_speed: "INSTANT"
    irreversibility: "TOTAL"
  - id: "LIQ_HIGH_VALUE_ELECTRONICS"
    mccs: [5732, 5045]
    haircut_discount_ratio: 0.15 # 85 cents on dollar
    settlement_speed: "HOURS_TO_DAYS"
