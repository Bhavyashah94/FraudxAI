    settlement_speed: "INSTANT"
    irreversibility: "TOTAL"

adversarial_playbooks:
  - id: "ADV_MICRO_AUTH_PROBE"
    name: "Automated Card Testing Micro-Probe"
    target_products: ["PROD_SUBPRIME_SECURED", "PROD_CLASSIC_REVOLVING", "PROD_GPR_PREPAID"]
    target_clusters: ["C1_HOURLY_GIG_WORKER", "C3_YOUNG_ADULT_STUDENT"]
    ticket_size_range_cents: [50, 199]
    target_mccs: [8398, 4899, 5815] # Charities, streaming micro-trials
    exploited_gaps:
      - "AVS_Z_ZIP_ONLY_BYPASS"
      - "PSD2_ARTICLE_16_LOW_VALUE"
    response_handling:
      iso_00_approved: "PROMOTE_TO_HIGH_TICKET_CASHOUT"
      iso_05_decline: "PURGE_AND_REQUEST_DARKNET_WARRANTY"
      iso_14_invalid: "PURGE_CARD"

  - id: "ADV_ATO_SILENT_BAKING"
    name: "Account Takeover with 14-Day Dormancy Baking"
    target_products: ["PROD_REWARDS_SIGNATURE", "PROD_ULTRA_PREMIUM_INFINITE"]
    target_clusters: ["C5_URBAN_TECH_PROFESSIONAL", "C4_SUBURBAN_FAMILY"]
    reconnaissance: "INFOSTEALER_SESSION_CREDENTIALS"
    action_sequence:
      step_1: "UPDATE_EMAIL_AND_SMS_PHONE_NUMBER"
      step_2: "DISABLE_PUSH_NOTIFICATIONS"
      step_3_silent_bake_seconds: 1209600 # 14 calendar days sleep
      step_4_drain_spend_cents: [300000, 800000] # $3,000 - $8,000
    expected_response: "ISO_00_APPROVED_DUE_TO_DECAYED_VELOCITY_COUNTERS"

  - id: "ADV_SLEEPER_BUST_OUT"
    name: "Synthetic Sleeper Bust-Out with ACH Float"
    target_products: ["PROD_SUBPRIME_SECURED"]
    target_clusters: ["C6_SMALL_BUSINESS_OWNER"]
    incubation_period_days: 365 # 1 year seasoning
    credit_graduation_target_cents: 1200000 # $12,000 line
    double_bust_out_sequence:
      t_0h: { action: "CHARGE_100_PERCENT_LIMIT", amount_cents: 1180000 }
      t_12h: { action: "SUBMIT_FRAUDULENT_ACH_PAYMENT", amount_cents: 1180000 }
      t_14h_memo_credit_float: { action: "CHARGE_SECOND_100_PERCENT_LIMIT", amount_cents: 1180000 }
      t_96h: { outcome: "ACH_BOUNCE_R01_ABANDON_IDENTITY" }
    total_extraction_multiplier: 2.0

  - id: "ADV_APPLE_PAY_YELLOW_PATH"
    name: "Token Provisioning Social Engineering (Yellow Path)"
    target_products: ["PROD_REWARDS_SIGNATURE", "PROD_ULTRA_PREMIUM_INFINITE"]
    target_clusters: ["C4_SUBURBAN_FAMILY", "C5_URBAN_TECH_PROFESSIONAL"]
    attack_mechanism: "REVERSE_PROXY_TELEPHONY_OTP_INTERCEPTION"
    post_binding_liquidation:
      channel: "CP_CONTACTLESS_NFC"
      mccs: [5732, 5651] # Apple Store, Luxury Fashion
      ticket_size_cents: [50000, 250000]
      chargeback_liability_outcome: "ISSUER_FULL_ABSORPTION"

  - id: "ADV_NOCTURNAL_BURST"
    name: "Circadian Nocturnal Carding Burst"
    target_products: ["ALL_CONSUMER_CREDIT", "PROD_CHECKING_DEBIT"]
    target_clusters: ["ALL"]
    attack_window_local_hour: [0, 5] # 00:00 - 05:00 local time
    burst_velocity_tx: 6
    spacing_seconds: [180, 420]
    expected_discovery_latency_seconds: 21600 # 6 hours (sleep suppressed)

  - id: "ADV_DISTRIBUTED_BIN_ENUMERATION"
    name: "PAN Enumeration Attack (PEA) via Distributed Additive Guessing"
    grounding_authority: "Ali et al. (IEEE S&P 2017) / Visa VAAI"
    target_bins: ["414720", "524890", "40001234"]
    search_space_complexity: "ADDITIVE_O_N_PLUS_M" # 1,060 reqs vs 60,000 multiplicative
    phase_1_expiry_probing:
      search_space_combinations: 60
      parallel_merchants_count: 30
      requests_per_merchant: 2
      target_response_transition: "ISO_54_EXPIRED_TO_ISO_82_INVALID_CVV"
      latency_budget_seconds: 2.5
    phase_2_cvv_probing:
      search_space_combinations: 1000
      parallel_merchants_count: 200
      requests_per_merchant: 5
      target_response_transition: "ISO_82_INVALID_CVV_TO_ISO_00_APPROVED"
      expected_attempts: 500
      latency_budget_seconds: 5.0
    network_countermeasures:
      visa_vaai:
        risk_score_field: "FIELD_44_VAAI"
        threshold_decline: 75
        inference_latency_ms: 1.0
        field_39_outcome: "05_OR_59"
      mastercard_aai:
        action: "NETWORK_SWITCH_PRE_AUTH_DROP"

  - id: "ADV_TRIANGULATION_FRAUD"
    name: "E-Commerce Triangulation Fraud Lifecycle"
    victim_roles:
      clean_customer: "PAYS_CLEAN_FIAT_RECEIVES_GOODS"
      target_retailer: "SHIPS_GOODS_BEARS_100_PCT_CHARGEBACK_LOSS"
      stolen_cardholder: "FILES_UNAUTHORIZED_DISPUTE_REASON_10_4"
      fraudster: "EXTRACTS_CLEAN_PROFIT_ZERO_CHARGEBACK_RECOURSE"
    discount_markup_ratio: 0.30 # Sold at 30% below MSRP on eBay/Amazon
    timing_lifecycle:
      t_0h: "DEPLOY_GHOST_STOREFRONT"
      t_24h: "CLEAN_BUYER_PURCHASES_DISCOUNT_ITEM"
      t_26h: "EXPLOIT_RETAILER_WITH_STOLEN_CARD_AND_CLEAN_SHIP_ADDRESS"
      t_96h: "RETAILER_DELIVERS_PRODUCT_CLEAN_BUYER_LEAVES_5_STAR_REVIEW"
      t_168h: "MARKETPLACE_RELEASES_CLEAN_PAYOUT_TO_MULE"
      t_720h: "STOLEN_CARDHOLDER_CHARGEBACK_SHOCKWAVE_HITS_RETAILER"
    chargeback_multiplier_range: [3.75, 4.23] # Cost to retailer per $1 fraud

  - id: "ADV_COLLUSIVE_BUST_OUT_MID"
    name: "Collusive PayFac Sub-MID Bust-Out"
    incubation_period_days: 60 # Clean transaction seasoning at 0.00% chargebacks
    initial_volume_cap_usd: 50000.00
    seasoned_volume_cap_usd: 250000.00
    strike_window:
      start_time: "FRIDAY_18_00_EST" # Long bank holiday weekend
      duration_hours: 48
      harvest_volume_usd: [150000.00, 600000.00]
      ticket_size_range_usd: [185.00, 475.00]
    payout_sweep_rail: "SAME_DAY_ACH_OR_INSTANT_DIRECT"
    fallout_chargeback_surge_ratio: 0.92 # 92% chargeback ratio post-abandonment
    regulatory_outcome: "MATCH_LISTING_REASON_08_11_14"

underground_spoofing_infrastructure:
  residential_proxy_networks:
    grounding: "DOJ 911 S5 Indictment / IEEE S&P 2019 (Mi et al.)"
    node_types: ["RESIDENTIAL_SOCKS5", "MOBILE_4G_5G_P2P"]
    sticky_session_duration_seconds: [600, 1800] # 10 to 30 min checkout hold
    asn_matching_criteria: "TARGET_VICTIM_CITY_RESIDENTIAL_ISP"
    max_geofence_distance_km: 25.0
  anti_detect_browser_mechanics:
    canvas_noise_injection:
      delta_rgb_variance: [-2, 2] # Deterministic pseudo-random seed
    webgl_spoofing:
      unmasked_vendor: "Google Inc. (NVIDIA)"
      unmasked_renderer: "ANGLE (NVIDIA, NVIDIA GeForce RTX 3070 Direct3D11 vs_5_0 ps_5_0)"
    audiocontext_noise:
      float32_buffer_variance: 0.000001
    webrtc_policy: "DISABLE_NON_PROXIED_UDP"
  counter_detection_fp_scanner:
    grounding: "USENIX Security 2018 (Vastel et al.)"
    checks:
      prototype_descriptor_tampering: "Function.prototype.toString.call"
      canvas_repeatability_test_count: 5 # Real GPU produces 5/5 identical hashes
      hardware_performance_discrepancy_threshold_ms: 45.0

