# spec/05_india_payment_rails.yaml
# Canonical Specification for Indian Payment Rails, Regulatory Invariants & Adversarial Playbooks
# Grounded in: Reserve Bank of India (PSS Act 2007), NPCI Operating Guidelines,
# RBI Circulars RBI/2017-18/15, RBI/2019-20/67, RBI/DPSS/2025-26/115, MHA I4C Compendia, Income Tax Rules 1962 (Rule 114B).

schema_version: "1.1.0"
unit_definitions:
  currency: "INR_paisa"  # 1 INR = 100 Paisa
  time: "seconds"
  latency: "milliseconds"
  probability: "[0.0, 1.0]"
  ratio: "bps_or_percentage"

india_regulatory_rails:
  additional_factor_of_authentication_afa:
    statutory_basis: "Payment and Settlement Systems Act, 2007 (Section 10(2) & 18)"
    domestic_cnp_enforcement: "STRICT_100_PERCENT"
    otp_validity_window_seconds: 180
    exemptions:
      contactless_nfc_tap:
        pin_free_ceiling_paisa: 500000       # ₹5,000.00 INR (RBI/2020-21/73)
        max_consecutive_pinless_tx: 5
        cumulative_pinless_ceiling_paisa: 1500000 # ₹15,000.00 INR
        exceeded_action: "FORCE_CONTACT_CHIP_AND_PIN"
      e_mandate_recurring:
        standard_ceiling_paisa: 1500000      # ₹15,000.00 INR
        high_value_category_ceiling_paisa: 10000000 # ₹1,00,000.00 INR (Mutual funds, insurance, card bills)
        pre_debit_notification_window_hours: 24
      offline_micropayments:
        per_tx_ceiling_paisa: 50000          # ₹500.00 INR (RBI/2021-22/150)
        instrument_max_balance_paisa: 200000 # ₹2,000.00 INR
        upi_lite_per_tx_ceiling_paisa: 100000 # ₹1,000.00 INR
        upi_lite_wallet_ceiling_paisa: 500000 # ₹5,000.00 INR

  card_on_file_tokenization_coft:
    mandate_circular: "RBI/2021-22/96"
    raw_pan_storage_allowed: false
    allowed_stored_metadata: ["last_4_digits", "issuer_name", "network"]
    token_service_providers: ["NPCI_TOKEN_CONNECT", "VTS", "MDES", "AMEX_TOKEN_SERVICE"]

  card_controls_default_state:
    mandate_circular: "RBI/2019-20/142"
    default_enabled: ["DOMESTIC_ATM", "DOMESTIC_POS_CONTACT"]
    default_disabled: ["DOMESTIC_CNP", "INTERNATIONAL_POS", "INTERNATIONAL_CNP", "CONTACTLESS_NFC"]

  rupay_credit_on_upi:
    small_merchant_turnover_ceiling_inr: 2000000.00
    small_merchant_zero_mdr_ceiling_paisa: 200000 # ₹2,000.00 INR zero MDR
    standard_mdr_percentage_range: [1.50, 2.00]
    p2p_credit_transfer_allowed: false

  customer_protection_limiting_liability:
    statutory_basis: "RBI/2017-18/15 (DBR.No.Leg.BC.78/09.07.005/2017-18)"
    zero_liability_scenarios:
      bank_contributory_fraud_or_deficiency: true
      third_party_breach_reported_within_working_days: 3
      customer_liability_paisa: 0
    limited_liability_tiers_reporting_4_to_7_working_days:
      bsbd_pmjdy_accounts_max_liability_paisa: 500000 # ₹5,000.00
      savings_ppi_credit_cards_le_5_lakh_paisa: 1000000 # ₹10,000.00
      credit_cards_gt_5_lakh_and_corporate_paisa: 2500000 # ₹25,000.00
    beyond_7_working_days: "BANK_BOARD_APPROVED_POLICY"
    customer_negligence_sharing_otp:
      liability: "CUSTOMER_100_PCT_UNTIL_REPORTED_BANK_100_PCT_POST_REPORT"
    provisional_shadow_credit_mandate_working_days: 10
    absolute_resolution_sla_calendar_days: 90
    burden_of_proof: "BANK_BEARS_100_PERCENT_BURDEN"

  harmonisation_tat_failed_transactions:
    statutory_basis: "RBI/2019-20/67 (DPSS.CO.PD No.629/02.01.014/2019-20)"
    auto_reversal_turnaround_times:
      atm_cash_not_dispensed_calendar_days: 5
      card_pos_ecom_transaction_failed_calendar_days: 5
      upi_imps_beneficiary_not_credited_calendar_days: 1
      ppi_wallet_failed_calendar_days: 1
    delayed_reversal_statutory_penalty_per_day_paisa: 10000 # ₹100.00 INR per day
    auto_compensation_credit_mandated: true

  payment_aggregator_escrow_settlement:
    statutory_basis: "RBI/DPSS/2025-26/115 (Master Direction on Payment Aggregators)"
    escrow_account_type: "SCHEDULED_COMMERCIAL_BANK_DEDICATED"
    merchant_payout_settlement_sla: "T_PLUS_1_BUSINESS_DAYS_MAX"
    commingling_with_corporate_funds: "STRICTLY_PROHIBITED"

indian_card_products:
  - id: "IN_PROD_KISAN_CREDIT_CARD"
    name: "Kisan Credit Card (KCC)"
    category: "AGRICULTURAL_REVOLVING"
    regulatory_framework: "RBI_NABARD_DLTC"
    credit_limit_paisa:
      min: 2500000       # ₹25,000.00
      median: 15000000   # ₹1,50,000.00
      max: 100000000     # ₹10,00,000.00
    effective_net_apr_percentage: 4.0   # 7% nominal with 3% prompt repayment incentive
    crop_season_cycles: ["KHARIF", "RABI"]
    primary_adversarial_vulnerabilities:
      - "BC_KIOSK_SKIMMING"
      - "LAND_PATTA_IDENTITY_THEFT"

  - id: "IN_PROD_PMJDY_RUPAY_DEBIT"
    name: "Pradhan Mantri Jan Dhan Yojana (PMJDY) RuPay Debit"
    category: "FINANCIAL_INCLUSION_DEBIT"
    regulatory_framework: "BSBDA_PMJDY"
    account_balance_paisa:
      min: 0
      median: 250000     # ₹2,500.00
      max: 1000000      # ₹10,000.00
    overdraft_facility_paisa: 1000000   # ₹10,000.00 OD
    inbuilt_accidental_insurance_paisa: 20000000 # ₹2 Lakhs
    primary_adversarial_vulnerabilities:
      - "AEPS_SILICONE_THUMB_SPOOFING"
      - "CYBER_MONEY_MULE_RECRUITMENT"

  - id: "IN_PROD_ENTRY_FD_BACKED"
    name: "Entry-Level FD-Backed Credit Card"
    category: "CONSUMER_CREDIT"
    regulatory_framework: "RBI_CARD_DIRECTIONS_2022"
    fixed_deposit_lien_ratio: 0.90      # 90% of FD balance
    credit_limit_paisa:
      min: 500000        # ₹5,000.00
      median: 2500000    # ₹25,000.00
      max: 5000000       # ₹50,000.00
    revolving_apr_percentage_range: [24.0, 42.0]
    primary_adversarial_vulnerabilities:
      - "MICRO_AUTH_PROBING"
      - "RAPID_RENT_PORTAL_CASHOUT"

  - id: "IN_PROD_SALARIED_PRIME_REWARDS"
    name: "Mid-Tier Salaried Prime Rewards Credit Card"
    category: "CONSUMER_CREDIT"
    regulatory_framework: "RBI_CARD_DIRECTIONS_2022"
    credit_limit_paisa:
      min: 5000000       # ₹50,000.00
      median: 15000000   # ₹1,50,000.00
      max: 50000000      # ₹5,00,000.00
    interest_free_grace_period_days: 50
    revolving_apr_percentage_range: [42.0, 45.0]
    primary_adversarial_vulnerabilities:
      - "REVERSE_PROXY_VISHING"
      - "MALICIOUS_ANDROID_APK_SMS_STEALER"
      - "RENT_PORTAL_CASHOUT"

  - id: "IN_PROD_SUPER_PREMIUM_HNI"
    name: "Super-Premium / HNI Infinite Metal Card"
    category: "CONSUMER_CREDIT"
    regulatory_framework: "RBI_CARD_DIRECTIONS_2022"
    credit_limit_paisa:
      min: 100000000     # ₹10,00,000.00
      median: 250000000   # ₹25,00,000.00
      max: 500000000     # ₹50,00,000.00
    forex_markup_percentage: 2.0
    primary_adversarial_vulnerabilities:
      - "INTERNATIONAL_NON_3DS_ROUTE_AROUND"
      - "CONCIERGE_ATO"
      - "LOYALTY_MILES_DRAINING"

indian_consumer_behavioral_quirks:
  payday_liquidity_cycle:
    private_sector_salary_credit_days: [28, 29, 30, 31]
    government_salary_credit_days: [1, 2, 3]
    statement_bill_payment_peak_days: [5, 6, 7, 8, 9, 10]
    liquidity_squeeze_days: [20, 21, 22, 23, 24, 25, 26, 27, 28]

  merchant_no_cost_emi:
    statutory_ban_on_zero_interest: "RBI/2013-14/292"
    upfront_merchant_discount_mechanism: true
    gst_on_interest_percentage: 18.0
    non_refundable_processing_fee_paisa: 19900 # ₹199.00 + 18% GST

  festival_seasonality:
    q3_q4_big_billion_days_surge:
      months: [9, 10]
      velocity_surge_multiplier: 6.0
      instant_discount_cap_paisa: 250000 # ₹2,500.00
    dhanteras_gold_splitting:
      mcc: 5944
      tax_rule_114b_pan_reporting_threshold_paisa: 20000000 # ₹2,00,000.00
      split_transaction_behavior:
        enabled: true
        swipes_count: [2, 3]
        spacing_seconds: [60, 180]
        ticket_ranges_paisa: [16500000, 19500000]

  fuel_surcharge_waiver_mcc_5541:
    surcharge_rate_percentage: 1.0
    qualifying_ticket_range_paisa: [40000, 400000] # ₹400 to ₹4,000
    monthly_waiver_cap_paisa: 25000                # ₹250.00
    gst_rate_percentage: 18.0
    gst_reversible_by_law: false

indian_adversarial_playbooks:
  - id: "IN_ADV_REVERSE_PROXY_VISHING"
    name: "Reverse-Proxy Vishing & Digital Arrest"
    target_products: ["IN_PROD_SALARIED_PRIME_REWARDS", "IN_PROD_SUPER_PREMIUM_HNI"]
    target_vulnerability: "HUMAN_COERCION_180S_OTP_RACE"
    lure_types: ["ELECTRICITY_BILL_CUTOFF", "DIGITAL_ARREST_CBI_POLICE", "REWARD_POINTS_EXPIRY"]
    ticket_size_paisa: [5000000, 50000000] # ₹50,000 to ₹5,00,000
    reverse_proxy_latency_seconds: [2.0, 8.0]

  - id: "IN_ADV_APK_SMS_STEALER"
    name: "Malicious Android APK SMS Forwarder"
    target_products: ["IN_PROD_SALARIED_PRIME_REWARDS", "IN_PROD_ENTRY_FD_BACKED"]
    vector: "WHATSAPP_TELEGRAM_SIDELOAD_APK"
    abused_permissions: ["android.permission.RECEIVE_SMS", "android.permission.READ_SMS", "AccessibilityService"]
    exfiltration_target: "TELEGRAM_BOT_API"
    silent_sms_suppression: true

  - id: "IN_ADV_INTL_NON_3DS_BYPASS"
    name: "International Non-3DS Gateway Route-Around"
    target_products: ["IN_PROD_SUPER_PREMIUM_HNI", "IN_PROD_SALARIED_PRIME_REWARDS"]
    prerequisite_card_state: "INTERNATIONAL_CNP_ENABLED == TRUE"
    target_merchant_geo: "US_EU_NON_3DS"
    auth_mti: "0100"
    eci_indicator: "07" # Non-authenticated
    time_window_ist_hours: [1.5, 5.5] # 01:30 - 05:30 AM IST (Cardholder asleep)
    ticket_size_usd: [150.0, 1500.0]

  - id: "IN_ADV_RENT_PORTAL_CASHOUT"
    name: "Credit-to-Bank Liquidation via Rent Portals"
    target_products: ["IN_PROD_SALARIED_PRIME_REWARDS", "IN_PROD_ENTRY_FD_BACKED"]
    platform_convenience_fee_percentage: 1.8
    settlement_rail: "IMPS_NEFT_T0"
    p2p_crypto_conversion_window_minutes: 10

  - id: "IN_ADV_SIM_SWAP_ESIM_HIJACK"
    name: "Telecom SIM Swap & eSIM Profile Hijack"
    target_products: ["IN_PROD_SUPER_PREMIUM_HNI", "IN_PROD_SALARIED_PRIME_REWARDS"]
    bypass_vector: "FRIDAY_EVENING_TELECOM_BLACKOUT_WINDOW"
    telecom_regulatory_cooldown_hours: 24 # TRAI mandatory SMS block post-swap
    exploit_channel: "IVR_VOICE_OTP_FALLBACK"

cfcfrms_1930_defensive_race:
  statutory_authority: "Indian Cybercrime Coordination Centre (I4C), MHA"
  helpline_number: 1930
  inter_bank_mesh_connected_entities: 250
  critical_golden_hour_cutoff_seconds: 900 # 15 minutes
  inter_bank_api_lien_propagation_latency_seconds: 180
  empirical_recovery_decay_model:
    formula: "P(recovery|t) = 0.82 * exp(-0.045 * t) for t <= 30 min; 0.21 * exp(-0.015 * t) for 30 < t <= 120 min; < 0.03 for t > 120 min"
    recovery_rates:
      under_15_minutes: [0.70, 0.80]
      between_15_and_45_minutes: [0.25, 0.40]
      beyond_60_minutes: 0.10
