current_slice:
  id: "slice-22-external-corpus-validation-of-pillar-1"
  title: "Grade Real and Third-Party Corpora with the Certification Grader's Own Pillar 1"
  status: "verified"  # [planning, in_progress, testing, verified]
  target_spec_files:
    - "spec/18_benchmark_reporting.yaml"
    - "scripts/score_external_corpus.py"
    - "tests/test_score_external_corpus.py"
    - "reports/pillar1_external_corpus_scorecard.md"
  acceptance_criteria:
    - external_corpora_are_graded_by_the_graders_own_function_and_spec_18_thresholds: true
    - a_metric_whose_inputs_the_corpus_lacks_is_excluded_from_the_verdict: true
    - every_external_corpus_records_its_source_url_and_sha256: true
    - inter_arrival_scores_are_reported_with_the_corpus_clock_resolution: true
    - the_real_corpus_result_is_published_next_to_the_threshold_it_fails: true
  verdict: >-
    verified: 302/302 tests green, including tests/test_score_external_corpus.py, which asserts the
    scorer reproduces the grader's own figures for the same seed and never grades a column the
    corpus does not carry. Measured at seed 42 against the US reference: the real ULB card corpus
    (284,807 transactions, OpenML file 1673544, sha256 fdaf1273...) fails log10(1+amount) at 0.3745
    while this generator fails it at 0.1508, both over the 0.150 limit, and a control drawn straight
    from the reference passes at 0.0000 -- so that gate ranks resemblance to the hardcoded lognormal,
    not resemblance to real card traffic. BankSim (594,643 rows, a competing simulator) scores
    0.2649. The inter-arrival gate is not comparable across clock resolutions (dt_min: BankSim
    3600 s, ULB 1 s, ours 0.01-0.3 s) and two of this generator's verdicts move with sample size at
    the grader's default n=1500. Command, provenance, hashes and caveats:
    reports/pillar1_external_corpus_scorecard.md

