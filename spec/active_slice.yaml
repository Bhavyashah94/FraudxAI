    4. Tier 4 (Episodic Life-Stage): Persistent multi-day state machines (CardholderState.RELOCATING 72h window,
       CardholderState.INTL_TRAVEL 7-14d) replacing ad-hoc conditional dice rolls.
    5. Pure-Python Numerical Implementation: Built-in modified Bessel function I_0(x) via series expansion without
       external Scipy dependencies, achieving 2,805 tx/s simulator throughput.

