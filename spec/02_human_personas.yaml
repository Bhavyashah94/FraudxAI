# spec/02_human_personas.yaml
# Canonical Specification for Human Consumer Personas & Spending Dynamics
# Grounded in: Federal Reserve Diary of Consumer Payment Choice (DCPC 2020-2026),
# BLS Consumer Expenditure Surveys, CFPB Consumer Credit Market Reports.

schema_version: "1.0.0"
unit_definitions:
  currency: "USD_cents"
  time: "seconds"
  arrival_rate: "events_per_second"
  velocity: "km_per_hour"
  probability: "[0.0, 1.0]"

