circadian_diurnal_model:
  mathematical_form: "periodic_24h_von_Mises_mixture"
  formula: "phi(t) = beta_0 + (24 - 24*beta_0) * sum(w_k * exp(kappa_k * cos(2*pi*(t - mu_k)/24)) / (24 * I_0(kappa_k)))"
  weekday_profile:
    nocturnal_floor_beta_0: 0.025
    components:
      - { name: "Morning Commute", mu_hour: 8.25, kappa: 4.2, weight: 0.22 }
      - { name: "Lunch Rush", mu_hour: 12.60, kappa: 4.8, weight: 0.32 }
      - { name: "Evening Errands", mu_hour: 18.50, kappa: 3.6, weight: 0.34 }
      - { name: "Night Browsing", mu_hour: 21.25, kappa: 3.0, weight: 0.12 }
  weekend_profile:
    nocturnal_floor_beta_0: 0.040
    components:
      - { name: "Brunch & Retail", mu_hour: 11.50, kappa: 2.4, weight: 0.42 }
      - { name: "Dinner Social", mu_hour: 18.75, kappa: 2.6, weight: 0.43 }
      - { name: "Nightlife", mu_hour: 23.25, kappa: 3.5, weight: 0.15 }

authentic_hard_negatives:
  - id: "HN_HOME_RELOCATION"
    name: "Home Relocation & Moving Surge"
    episodic_window_seconds: 259200  # 72 hours
    velocity_multiplier: 5.5
    spend_percentile_target: "p99"
    characteristic_mccs: [7513, 4225, 5200, 5712, 4900]
    ground_truth_discriminators:
      valid_emv_arqc_chip: true
      kinematic_corridor_highway_speed_kmh: [65.0, 110.0]

  - id: "HN_CROSS_BORDER_TRAVEL"
    name: "International Vacation & Business Travel"
    booking_trail_lookback_days: 21
    transit_mccs: [5309, 5812, 4816, 4121]
    destination_mccs: [7011, 5812, 5651]
    foreign_currency_flag: true
    ground_truth_discriminators:
      flight_velocity_kmh: [750.0, 920.0]
      prior_airline_auth_exists: true
      contactless_token_present: true

cardholder_discovery_survival_model:
  tiers:
    tier_1_push_sms:
      model: "LogNormal"
      params: { mu_log: 5.2, sigma_log: 0.85 }
      median_seconds: 181  # ~3.0 minutes
    tier_2_app_checker:
      model: "Weibull"
      params: { shape_k: 1.8, scale_hours: 36.0 }
      median_seconds: 110880  # ~30.8 hours
    tier_3_statement_cycle:
      model: "Uniform"
      params: { min_days: 3, max_days: 45, mean_days: 21.5 }
    tier_4_passive:
      discovery_seconds: "Infinity"
  conditional_flagging_probability:
    formula: "P(Flag | x, c) = 1 - exp(-(x / x_0)^alpha) * [1 - delta_0 * (1 - c)]"
    params:
      x_0_usd: 45.00
      alpha: 1.35
      delta_0: 0.40
